<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>local-GPT-live 最小会話デモ</title>
  <style>
    body { font-family: sans-serif; max-width: 48rem; margin: 2rem auto; padding: 1rem; }
    label { display: block; margin: .6rem 0; }
    input, textarea { width: 100%; box-sizing: border-box; }
    button { padding: .6rem; margin: .3rem; }
    [role=alert] { color: #a00; }
  </style>
</head>
<body>
  <h1>最小会話デモ</h1>
  <p>取得済みの接続設定を入力します。トークンは保存しません。</p>
  <label>接続URL<input id="url" autocomplete="off"></label>
  <label>トークン<input id="token" type="password" autocomplete="off"></label>
  <label>host identity<input id="host-identity" autocomplete="off"></label>
  <label>host SID<input id="host-sid" autocomplete="off"></label>
  <label>Session ID<input id="session" autocomplete="off"></label>
  <label>connection ID<input id="connection" autocomplete="off"></label>
  <button id="connect">接続</button>
  <button id="synchronize">host同期</button>
  <button id="disconnect">切断</button>
  <p id="participant" role="status" aria-label="参加者"></p>
  <p>先に接続して参加者SIDをCLIへ渡します。CLIの設定とhost SIDを入力後、host同期を押してください。</p>
  <p id="connection-state" role="status" aria-label="接続状態">未接続</p>
  <p id="input-state" role="status" aria-label="入力状態">停止</p>
  <p id="output-state" role="status" aria-label="出力状態">待機</p>
  <p id="error" role="alert" hidden></p>
  <button id="start" disabled>マイク開始</button>
  <button id="stop" disabled>マイク停止</button>
  <label>テキスト<textarea id="text"></textarea></label>
  <button id="send" disabled>送信</button>
  <button id="cancel" disabled>取消</button>
  <button id="reconnect" disabled>再接続</button>
  <p>生成完了・再生準備・送出からの推定終了は別の状態です。実出音・聴取済みを保証しません。</p>
  <p>hostの接続診断モードは短い合成音と入力到達量の確認専用です。通常会話の成功とは区別します。</p>
  <script type="module" src="./demo.mjs"></script>
</body>
</html>
