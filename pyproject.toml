[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "local-gpt-live"
version = "0.1.0"
description = "かぶせ発話に対応するローカル音声基盤"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "numpy==2.2.6", "onnxruntime==1.27.0", "wasmtime==36.0.0"]

[project.optional-dependencies]
livekit = ["livekit==1.1.16"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "ruff==0.14.0", "mypy==1.18.2", "build==1.3.0"]

[project.scripts]
voice-demo = "local_gpt_live.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/local_gpt_live"]
