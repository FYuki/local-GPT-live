name: Bootstrap
on:
  pull_request:
  push:
    branches: [main, 'epic/**']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: git diff --check $(git hash-object -t tree /dev/null) HEAD
